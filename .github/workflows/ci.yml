name: Bootstrap CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

# #1696: `develop` war hier nicht genannt. Gearbeitet wird nach den
# Arbeitsregeln aber ausschliesslich gegen `develop` -- Branches gehen von dort
# aus, PRs dorthin zurueck. Die CI lief damit fuer keinen einzigen echten PR,
# sondern nur beim seltenen Zusammenfuehren nach `main`. Ein Lauf, der zu spaet
# kommt, ist so gut wie keiner.

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Make seed binary executable
        run: chmod +x src/lyxc_bootstrap

      # #1933: tests/lyx_units_fuzz_test.sh rechnet std.sparse gegen eine
      # numpy-Referenz nach. numpy ist auf ubuntu-latest NICHT vorinstalliert,
      # der Vergleich fiel damit aus. scipy ist optional (die Referenz prueft
      # das selbst), wird aber mitgenommen: es misst zusaetzlich gegen eine
      # zweite, unabhaengige Implementierung.
      - name: Python-Referenzen (numpy/scipy)
        run: python3 -m pip install --quiet numpy scipy

      - name: Build lyxc from bootstrap
        run: make build

      - name: Singularity check (S3 == S4)
        run: make singularity

      - name: Integration test
        run: make test

      # tests/lyx/** und die bekannt roten .sh-Tests. Beide Ziele liefen bis
      # #1112 nirgends — ein Ziel, das niemand aufruft, ist derselbe Verfall
      # wie ein Test, der in keinem Ziel steht.
      - name: Lyx integration tests (tests/lyx/**)
        run: make test-lyx-integration

      - name: Known-red tests (.sh)
        run: make test-known-red

      # #1696: Beide lyxos-Ziele hingen an keinem Sammelziel und liefen
      # nirgends. Entsprechend waren sie rot, ohne dass es auffiel: drei
      # Dateien in tests/lyxos/ scheiterten seit ihrer Einfuehrung (LX-23) am
      # Parser. Dieselbe Lehre wie oben bei #1112, nur eine Ecke weiter.
      #
      # Beide pruefen ausschliesslich, ob UEBERSETZT wird -- der erzeugte Code
      # laeuft auf dem Buildhost nicht. Als Rauchtest ist das in Ordnung; es
      # ist zugleich die einzige Absicherung des Ziels.
      - name: LyxOS integration (tests/lyxos/**)
        run: make test-lyxos

      - name: LyxOS units (tests/suite-lyxos.txt)
        run: make test-lyxos-units

      # #1696: Beim Nachzaehlen fielen zwei weitere Ziele auf, die niemand
      # faehrt. `test-lyx` ist die VOLLSUITE (408 Tests) — bis eben lief hier
      # nur test-lyx-integration, ein anderer Runner. `test-external` prueft
      # nur die UEBERSETZBARKEIT (Zugangsdaten braucht es dafuer nicht) und
      # wurde nach #1004 ausdruecklich als Verfallsschutz gebaut; er lief
      # seither selbst nirgends.
      #
      # test-lyx konnte vorher gar nicht gruen sein: tests/suite-full.txt
      # nennt drei Dateien, die .gitignore ausschloss (#1699, in diesem PR mit
      # behoben) — auf einem frischen Klon fehlten sie.
      - name: Lyx full suite (tests/suite-full.txt)
        run: make test-lyx

      - name: External suite (Uebersetzbarkeit)
        run: make test-external

      - name: Snapshot tests
        run: |
          if [ -f tests/run_snapshot_tests.sh ]; then
            make snapshot
          else
            echo "No snapshot tests found, skipping."
          fi
