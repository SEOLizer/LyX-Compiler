[package]
name        = "std.crypto"
version     = "0.1.0"
author      = "Andreas Röne"
license     = "MIT"
description = "Kryptographie: AES, ECC, X25519, HMAC, SHA-*, Keccak, PQC (ML-KEM/DSA/SLH-DSA/DADQ)"

[sources]
files = ["crypto/aes.lyx", "crypto/ecc.lyx", "crypto/x25519.lyx", "crypto/hmac.lyx", "crypto/sha256.lyx", "crypto/sha1.lyx", "crypto/md5.lyx", "crypto/keccak.lyx", "crypto/rand.lyx", "crypto/ct.lyx", "crypto/ntt.lyx", "crypto/pqc/mlkem.lyx", "crypto/pqc/mldsa.lyx", "crypto/pqc/slhdsa.lyx", "crypto/pqc/dadq.lyx", "crypto/pqc/hybrid.lyx", "crypto/pqc/pqc.lyx"]

[dependencies]
std.alloc  = "^0.1.0"
std.string = "^0.1.0"
std.hash   = "^0.1.0"
std.math   = "^0.1.0"
